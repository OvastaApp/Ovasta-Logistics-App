[versions]
# 8.13+: with Kotlin 2.2.20, AGP 8.11 leaves the app classes off the unit-test compile classpath
agp = "8.13.2"
coilCompose = "3.3.0"
coreSplashscreen = "1.0.1"
datastorePreferences = "1.1.7"
exifinterface = "1.4.1"
# 34.18: what GitLive 2.7.0 (Firestore/Auth in :shared) is built on
firebaseBom = "34.18.0"
koinAndroid = "4.1.0"
koinAndroidxScope = "2.2.3"
kotlinxSerializationJson = "1.9.0"
kotlin = "2.2.20"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.9.2"
composeBom = "2024.09.00"
lifecycleViewmodelKtx = "2.9.2"
lifecycleViewmodelKtxVersion = "2.9.3"
navigationCompose = "2.9.3"
navigationUi = "2.9.3"
okhttp = "5.1.0"
securityCrypto = "1.1.0-alpha06"
uiTestManifest = "1.8.3"
compose-ui = "1.8.3"
compose-material3 = "1.3.1"
lifecycle-viewmodel-compose = "2.8.7"
constraintlayout-compose = "1.1.1"
googleServices = "4.4.3"
firebaseCrashlytics = "3.0.7"
playServicesLocation = "21.2.0"
kotlinxDatetime = "0.7.1"
desugarJdkLibs = "2.1.5"
# Compose Multiplatform for :shared. 1.10 is what JetBrains navigation3 1.1.x is built on,
# so AppNavHost can keep Navigation3 when the UI moves to commonMain
composeMultiplatform = "1.10.3"
coroutines = "1.10.2"
ktor = "3.3.3"
# 2.7.0 is built on Firebase BOM 34.18, the same major as the app (2.4.0 is on 33.x)
gitliveFirebase = "2.7.0"
# Compose Multiplatform UI for :shared, aligned with composeMultiplatform 1.10.3
composeMpMaterial3 = "1.9.0"
composeMpMaterialIcons = "1.7.3"
jetbrainsLifecycle = "2.10.0"
nav3Core = "1.0.1"
lifecycleViewmodelNav3 = "2.11.0-alpha03"
kotlinxSerializationCore = "1.9.0"
material3AdaptiveNav3 = "1.3.0-alpha09"


